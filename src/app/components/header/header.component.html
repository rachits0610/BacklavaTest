<header class="header">
  <div class="logo-area">
    <button
      class="hamburger"
      *ngIf="showHamburger"
      (click)="onHamburgerClick()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="3" y1="6" x2="21" y2="6" />
        <line x1="3" y1="12" x2="21" y2="12" />
        <line x1="3" y1="18" x2="21" y2="18" />
      </svg>
    </button>
    <div class="logo-mark"><h3>B</h3></div>
    <span routerLink="/" class="logo-name">The Baklava Studio</span>
  </div>

  <div class="user-area">
    <button class="user-trigger" (click)="toggleDropdown()">
      <div class="user-avatar">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
      </div>
      <span class="user-name">{{ userName }}</span>
      <i class="fas fa-chevron-down chevron" [class.open]="dropdownOpen"></i>
    </button>

    <div class="dropdown" [class.open]="dropdownOpen">
      <div class="dropdown-user">
        <div class="dropdown-user-name">{{ userName }}</div>
        <div class="dropdown-user-role">{{ userRole }}</div>
        <button (click)="openChangePassword()" class="change-psw-btn">
          Change Password
        </button>
        <!-- Functionality of adding new Admin Currently nopt needed -->
        <!-- <button (click)="openAddNewUser()" class="new-user">
          Create New Admin
        </button> -->
      </div>
      <div class="dropdown-item" (click)="logout()">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m16 17 5-5-5-5" />
          <path d="M21 12H9" />
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        </svg>
        Log out
      </div>
    </div>
  </div>
</header>

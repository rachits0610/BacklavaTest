<div class="modal-wrapper">
  <div class="modal-header">
    <h5 class="modal-title">Delete Category</h5>
    <button type="button" class="close-btn" (click)="dismiss()">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path
          d="M12 4L4 12M4 4l8 8"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
    </button>
  </div>

  <div class="modal-body">
    <div class="delete-icon">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
        <path
          d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M10 11v6M14 11v6"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
    </div>
    <p class="delete-title">Are you sure?</p>
    <p class="delete-subtitle">This will permanently delete the Category.</p>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn-cancel" (click)="dismiss()">Cancel</button>
    <button type="button" class="btn-delete" (click)="onDelete()">
      Delete
    </button>
  </div>
</div>

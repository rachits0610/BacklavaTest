<div class="add-user-container">
  <div class="add-user-card">
    <h2>Add New User</h2>

    <form [formGroup]="addUserForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Admin Name</label>

        <input
          type="text"
          formControlName="adminName"
          placeholder="Enter admin name"
        />

        <small
          *ngIf="
            addUserForm.get('adminName')?.invalid &&
            addUserForm.get('adminName')?.touched
          "
        >
          Admin name is required
        </small>
      </div>

      <div class="form-group">
        <label>Phone Number</label>

        <input
          type="text"
          formControlName="phoneNumber"
          placeholder="Enter phone number"
        />

        <small
          *ngIf="
            addUserForm.get('phoneNumber')?.invalid &&
            addUserForm.get('phoneNumber')?.touched
          "
        >
          Enter valid 10 digit phone number
        </small>
      </div>

      <div class="form-group">
        <label>Email</label>

        <input type="email" formControlName="email" placeholder="Enter email" />

        <small
          *ngIf="
            addUserForm.get('email')?.invalid &&
            addUserForm.get('email')?.touched
          "
        >
          Enter valid email
        </small>
      </div>

      <div class="form-group">
        <label>Username</label>

        <input
          type="text"
          formControlName="username"
          placeholder="Enter username"
        />

        <small
          *ngIf="
            addUserForm.get('username')?.invalid &&
            addUserForm.get('username')?.touched
          "
        >
          Username is required
        </small>
      </div>

      <div class="form-group">
        <label>Password</label>

        <input
          type="password"
          formControlName="password"
          placeholder="Enter password"
        />

        <small
          *ngIf="
            addUserForm.get('password')?.invalid &&
            addUserForm.get('password')?.touched
          "
        >
          Password must be at least 6 characters
        </small>
      </div>

      <div class="form-group">
        <label>Role ID</label>

        <input
          type="number"
          formControlName="roleId"
          placeholder="Enter role id"
        />

        <small
          *ngIf="
            addUserForm.get('roleId')?.invalid &&
            addUserForm.get('roleId')?.touched
          "
        >
          Role ID is required
        </small>
      </div>

      <button type="submit" [disabled]="addUserForm.invalid">Add User</button>
    </form>
  </div>
</div>

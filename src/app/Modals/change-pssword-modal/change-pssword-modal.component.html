<div class="change-password-container">
  <div class="change-password-card">
    <div class="modal-header-row">
      <h2>Change Password</h2>
      <button class="close-btn" type="button" (click)="close()">
        &#x2715;
      </button>
    </div>

    <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()">
      <!-- Old Password -->
      <div class="form-group">
        <label for="oldPassword">Old Password</label>
        <div class="input-wrapper">
          <input
            [type]="showOld ? 'text' : 'password'"
            id="oldPassword"
            formControlName="oldPassword"
            placeholder="Enter old password"
            [class.input-error]="
              f['oldPassword'].invalid && f['oldPassword'].touched
            "
          />
          <button type="button" class="eye-btn" (click)="showOld = !showOld">
            <ng-container *ngIf="!showOld">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </ng-container>
            <ng-container *ngIf="showOld">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"
                />
                <path
                  d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"
                />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </ng-container>
          </button>
        </div>
        <small *ngIf="f['oldPassword'].invalid && f['oldPassword'].touched">
          Old password is required.
        </small>
      </div>

      <!-- New Password -->
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <div class="input-wrapper">
          <input
            [type]="showNew ? 'text' : 'password'"
            id="newPassword"
            formControlName="newPassword"
            placeholder="Enter new password"
            [class.input-error]="
              f['newPassword'].invalid && f['newPassword'].touched
            "
          />
          <button type="button" class="eye-btn" (click)="showNew = !showNew">
            <ng-container *ngIf="!showNew">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </ng-container>
            <ng-container *ngIf="showNew">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"
                />
                <path
                  d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"
                />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </ng-container>
          </button>
        </div>
        <small *ngIf="f['newPassword'].invalid && f['newPassword'].touched">
          New password must be at least 6 characters.
        </small>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="input-wrapper">
          <input
            [type]="showConfirm ? 'text' : 'password'"
            id="confirmPassword"
            formControlName="confirmPassword"
            placeholder="Re-enter new password"
            [class.input-error]="
              (f['confirmPassword'].invalid && f['confirmPassword'].touched) ||
              (changePasswordForm.hasError('passwordMismatch') &&
                f['confirmPassword'].touched)
            "
          />
          <button
            type="button"
            class="eye-btn"
            (click)="showConfirm = !showConfirm"
          >
            <ng-container *ngIf="!showConfirm">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </ng-container>
            <ng-container *ngIf="showConfirm">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"
                />
                <path
                  d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"
                />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </ng-container>
          </button>
        </div>
        <small
          *ngIf="f['confirmPassword'].invalid && f['confirmPassword'].touched"
        >
          Confirm password is required.
        </small>
        <small
          *ngIf="
            changePasswordForm.hasError('passwordMismatch') &&
            f['confirmPassword'].touched &&
            f['confirmPassword'].valid
          "
        >
          Passwords do not match.
        </small>
      </div>

      <button type="submit" [disabled]="changePasswordForm.invalid">
        Update Password
      </button>
    </form>
  </div>
</div>

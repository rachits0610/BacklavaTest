<div class="modal-wrapper">
  <div class="modal-header">
    <h5 class="modal-title">{{ modalHeading }}</h5>
    <button type="button" class="close-btn" (click)="dismiss()">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path
          d="M12 4L4 12M4 4l8 8"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
    </button>
  </div>

  <div class="modal-body">
    <form [formGroup]="categoryForm">
      <!-- Category Name -->
      <div class="form-group">
        <label class="form-label" for="category">
          Category Name <span class="required-star">*</span>
        </label>
        <input
          id="category"
          type="text"
          class="form-input"
          placeholder="e.g. Baklava, Desserts"
          formControlName="categoryName"
          [class.input-error]="isInvalid('categoryName')"
          (input)="onCategoryNameInput($event)"
          autocomplete="off"
          maxlength="50"
        />
        <div class="field-footer">
          <span class="error-msg" *ngIf="isInvalid('categoryName')">
            {{ getError("categoryName") }}
          </span>
          <span
            class="char-count"
            [class.char-count--warn]="categoryNameLength >= 45"
          >
            {{ categoryNameLength }}/50
          </span>
        </div>
      </div>

      <!-- Status -->
      <div class="form-group">
        <label class="form-label" for="status">Status</label>
        <div class="select-wrapper">
          <select id="status" class="form-select" formControlName="status">
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
          <svg
            class="select-icon"
            width="16"
            height="16"
            viewBox="0 0 16 16"
            fill="none"
          >
            <path
              d="M4 6l4 4 4-4"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
      </div>

      <!-- Description -->
      <!-- <div class="form-group">
        <label class="form-label" for="description">
          Description <span class="optional-tag">Optional</span>
        </label>
        <textarea
          id="description"
          class="form-textarea"
          placeholder="Brief description of this category..."
          formControlName="description"
          [class.input-error]="isInvalid('description')"
          (input)="onDescriptionInput($event)"
          maxlength="250"
          rows="3"
        ></textarea>
        <div class="field-footer">
          <span class="error-msg" *ngIf="isInvalid('description')">
            {{ getError("description") }}
          </span>
          <span
            class="char-count"
            [class.char-count--warn]="descriptionLength >= 230"
          >
            {{ descriptionLength }}/250
          </span>
        </div>
      </div> -->
    </form>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn-cancel" (click)="dismiss()">
      {{ isView ? "Close" : "Cancel" }}
    </button>
    <button
      *ngIf="!isView"
      type="button"
      class="btn-save"
      (click)="onSave()"
      [disabled]="categoryForm.invalid && categoryForm.touched"
    >
      {{ mode === "edit" ? "Update" : "Save Changes" }}
    </button>
  </div>
</div>

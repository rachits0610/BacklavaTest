<div id="sub-category-wrapper">
  <app-breadcrum [header]="'Payments'" />
  <div class="sub-cattegory-main">
    <app-add-filter-btn
      [showAddBtn]="false"
      [showFilterBtn]="true"
      [isOrderComp]="true"
      [showOrderStatus]="false"
      [paymentStatusDDl]="paymentStatusDDL"
      [addbtnLabel]="'Payment'"
      (onAdd)="addPayment()"
      (onFilter)="filterData($event)"
    />

    <app-reusable-table
      [showAddBtn]="false"
      [showFilterBtn]="false"
      [headers]="column"
      [tableHead]="tableHead"
      [data]="payments"
      [loading]="apiLoading"
      [noOfData]="noOfData"
      [pageNo]="page.pageNo"
      [pageSize]="page.pageSize"
      [pageArr]="pageArr"
      [isNextPageAvailable]="isNextPageAvailable"
      [showActions]="true"
      [showView]="true"
      [showEdit]="false"
      [showDelete]="false"
      (pageChange)="onPageChange($event)"
      (onView)="openViewPage($event)"
      (filterData)="filterData($event)"
    />
  </div>
</div>
